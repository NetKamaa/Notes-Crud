services:
  postgres:
    image: postgres:16
    container_name: notes-postgres
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
      POSTGRES_DB: notes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
